name = "preflight"
main = "src/index.js"
compatibility_date = "2024-09-23"
# Serve on the custom domain (Cloudflare creates the DNS record and certificate on deploy)
routes = [
  { pattern = "prelaunchcheck.dev", custom_domain = true },
  { pattern = "www.prelaunchcheck.dev", custom_domain = true }
]


[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Create with: npx wrangler kv namespace create SCANS  (or in the Cloudflare dashboard)
[[kv_namespaces]]
binding = "SCANS"
id = "e96b23c43bc144a3a5df2e416e83047f"

[vars]
PRICE_LABEL = "$7"
# Your Stripe Payment Link, e.g. https://buy.stripe.com/xxxx
STRIPE_PAYMENT_LINK = "https://buy.stripe.com/eVq28t2w2eaG9RjdUB5wI00"
# STRIPE_SECRET_KEY is a secret: set it in the Cloudflare dashboard, never here.
